<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <title>超哥超车 · 数字人语音助手</title>
  <link rel="stylesheet" href="static/style.css" />
  <style>
    .topbar h1 { color: #e94560; }
    .topbar h1 .accent { color: #fff; }
    .avatar-state {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      z-index: 2;
    }
    .avatar-state.idle { color: #8b949e; }
    .avatar-state.listening { color: #3fb950; }
    .avatar-state.thinking { color: #d29922; }
    .avatar-state.speaking { color: #ff6b00; }
    .avatar-state.danger { color: #f85149; }
    .api-indicator {
      font-size: 12px;
      color: #8b949e;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #30363d;
    }
    .api-indicator.online { color: #3fb950; border-color: #3fb950; }
    .cam-wrap.live .cam-fallback { display: none; }
    .overlay {
      position: fixed;
      inset: 0;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { color: #e94560; font-size: 28px; margin-bottom: 8px; }
    .overlay p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
    .overlay .start-btn {
      padding: 14px 48px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      background: #e94560;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .overlay .start-btn:hover { transform: scale(1.05); }
    .overlay .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .shortcuts {
      margin-top: 16px;
      font-size: 12px;
      color: #484f58;
      text-align: center;
    }
    .shortcuts kbd {
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #30363d;
      font-family: inherit;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="overlay" class="overlay">
    <h2>🚗 超哥超车</h2>
    <p>数字人语音助手 · 云端对话</p>
    <button id="start-btn" class="start-btn" disabled>连接中...</button>
    <div class="shortcuts"><kbd>M</kbd> 静音 / <kbd>Esc</kbd> 挂断</div>
  </div>
  <main class="stage">
    <header class="topbar">
      <div class="topbar-left">
        <h1>超哥<span class="accent">超车</span></h1>
        <span id="status" class="status">未连接</span>
      </div>
      <div class="topbar-right">
        <span id="api-indicator" class="api-indicator">WS · 连接中</span>
      </div>
    </header>
    <section class="call-view">
      <div class="cam-wrap" id="cam-wrap">
        <video id="user-cam" autoplay muted playsinline></video>
        <div id="cam-fallback" class="cam-fallback">📷 摄像头未开启</div>
        <span class="pane-label">你</span>
      </div>
      <div class="avatar-wrap" id="avatar-wrap">
        <canvas id="avatar-canvas" width="512" height="512"></canvas>
        <div id="avatar-fallback" class="avatar-fallback hidden">数字人加载中...</div>
        <span class="pane-label" id="avatar-label">超哥</span>
        <span id="avatar-state" class="avatar-state idle">待机中</span>
      </div>
    </section>
    <nav id="persona-bar" class="persona-bar" aria-label="人设切换">
      <button class="persona-chip active">超哥</button>
    </nav>
    <section class="transcript" id="transcript" aria-live="polite">
      <div class="line sys">👋 说句话就能跟超哥唠嗑了！</div>
    </section>
    <footer class="controls">
      <button id="cam-toggle" class="cam-toggle">📷 摄像头</button>
      <button id="mic-btn" class="mic-btn" disabled>🎙 开始对话</button>
    </footer>
    <p class="hint">说话即可与超哥唠嗑，随时可以打断他</p>
  </main>
  <script src="static/assistant.js?v=20260802"></script>
</body>
</html>
