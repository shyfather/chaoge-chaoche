<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>超哥视频通话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #fff; user-select: none; }

/* ===== 主容器 ===== */
#call-container {
  position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column;
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
  overflow: hidden;
}

/* ===== 超哥视频区域 ===== */
#remote-video {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#remote-video video {
  width: 100%; height: 100%; object-fit: cover;
}
.video-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.6));
  pointer-events: none;
}
#avatar-canvas {
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}

/* ===== 视频状态标签 ===== */
#video-status-tag {
  position: absolute; top: 20px; left: 20px; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; background: rgba(0,0,0,0.5); border-radius: 20px;
  backdrop-filter: blur(10px); font-size: 12px; color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.08);
}
#video-status-tag .rec-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
  animation: rec-pulse 1.5s ease-in-out infinite;
}
@keyframes rec-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ===== 名称标签（底部） ===== */
#name-tag {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  text-align: center; z-index: 10;
}
#name-tag .name {
  font-size: clamp(18px, 3vw, 26px); font-weight: 700;
  letter-spacing: 2px; text-shadow: 0 2px 20px rgba(0,0,0,0.8);
}
#name-tag .status {
  font-size: clamp(11px, 1.5vw, 14px); color: #4ade80; margin-top: 4px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; gap: 6px;
}
#name-tag .status .dot {
  display: inline-block; width: 6px; height: 6px; background: #4ade80;
  border-radius: 50%; animation: blink-dot 1.5s ease-in-out infinite;
}
@keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ===== 通话计时 ===== */
#call-timer {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  font-size: clamp(13px, 2vw, 16px); font-weight: 500; letter-spacing: 2px;
  color: rgba(255,255,255,0.6); text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  z-index: 10; font-variant-numeric: tabular-nums;
  padding: 4px 16px; background: rgba(0,0,0,0.3); border-radius: 12px;
  backdrop-filter: blur(10px);
}

/* ===== 字幕区域 ===== */
#subtitle-area {
  position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  width: min(85%, 650px); text-align: center; z-index: 10;
  pointer-events: none;
}
#user-subtitle {
  font-size: clamp(12px, 1.8vw, 15px); color: rgba(255,255,255,0.4);
  margin-bottom: 6px; min-height: 1.4em; transition: all 0.3s;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
#ai-subtitle {
  font-size: clamp(14px, 2.2vw, 18px); color: #fff; font-weight: 500;
  min-height: 1.4em; text-shadow: 0 2px 15px rgba(0,0,0,0.8);
  line-height: 1.5;
}
#ai-subtitle .cursor-blink {
  display: inline-block; width: 2px; height: 1.1em; background: #ff6b00;
  margin-left: 2px; animation: cur-blink 0.8s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes cur-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* ===== 思考提示 ===== */
#thinking-indicator {
  display: none; position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  align-items: center; gap: 10px; font-size: clamp(12px, 1.8vw, 15px);
  color: rgba(255,255,255,0.5); text-shadow: 0 2px 10px rgba(0,0,0,0.8); z-index: 10;
}
#thinking-indicator.active { display: flex; }
.think-dots { display: flex; gap: 4px; }
.think-dots span {
  width: 5px; height: 5px; background: #ff6b00; border-radius: 50%;
  animation: tb 1.2s ease-in-out infinite;
}
.think-dots span:nth-child(2) { animation-delay: 0.2s; }
.think-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes tb { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }

/* ===== 控制栏 ===== */
#controls {
  position: absolute; bottom: max(20px, env(safe-area-inset-bottom, 20px));
  left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: clamp(20px, 5vw, 36px);
  z-index: 20; padding: 8px 24px;
  background: rgba(0,0,0,0.5); border-radius: 40px;
  backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06);
}
.ctrl-btn {
  width: clamp(46px, 7vw, 56px); height: clamp(46px, 7vw, 56px);
  border-radius: 50%; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; position: relative;
  background: rgba(255,255,255,0.1);
}
.ctrl-btn svg { width: clamp(20px, 3vw, 24px); height: clamp(20px, 3vw, 24px); fill: #fff; }
.ctrl-btn:active { transform: scale(0.88); }
.ctrl-btn.mute.active { background: #ef4444; }
.ctrl-btn.end-call { background: #ef4444; width: clamp(52px, 8vw, 64px); height: clamp(52px, 8vw, 64px); box-shadow: 0 4px 20px rgba(239,68,68,0.4); }
.ctrl-btn.end-call:hover { background: #dc2626; }
.ctrl-btn.end-call:active { background: #b91c1c; }
.ctrl-btn.flip-cam { background: rgba(255,255,255,0.1); }
.ctrl-btn.flip-cam.active { background: rgba(255,107,0,0.4); }
.ctrl-btn-label {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: rgba(255,255,255,0.4); white-space: nowrap;
}

/* ===== 本地摄像头小窗 ===== */
#local-video {
  position: absolute; top: 20px; right: 20px;
  width: min(110px, 22vw); height: min(146px, 30vw);
  border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,0.15);
  z-index: 15; background: #111; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#local-video video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#local-video .no-cam {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 4px; color: rgba(255,255,255,0.2); font-size: 10px;
}
#local-video .no-cam svg { width: 24px; height: 24px; fill: rgba(255,255,255,0.15); }

/* ===== 通话结束遮罩 ===== */
#call-ended {
  display: none; position: absolute; inset: 0;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
  z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
#call-ended.active { display: flex; }
#call-ended .end-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(239,68,68,0.15); display: flex; align-items: center; justify-content: center;
}
#call-ended .end-icon svg { width: 28px; height: 28px; fill: #ef4444; }
#call-ended .end-text { font-size: clamp(18px, 3vw, 22px); font-weight: 600; }
#call-ended .end-dur { font-size: clamp(13px, 2vw, 15px); color: rgba(255,255,255,0.4); }
#call-ended .end-btn {
  margin-top: 8px; padding: 12px 44px; border-radius: 25px; border: none;
  background: #ff6b00; color: #fff; font-size: 16px; cursor: pointer; transition: all 0.2s;
}
#call-ended .end-btn:hover { background: #e66000; transform: translateY(-2px); }

/* ===== 加载动画 ===== */
#loading-screen {
  position: absolute; inset: 0; background: #000; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  transition: opacity 0.8s;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }
#loading-screen .loader {
  width: 56px; height: 56px; border: 3px solid rgba(255,107,0,0.1);
  border-top-color: #ff6b00; border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen .load-text { font-size: 16px; color: rgba(255,255,255,0.6); letter-spacing: 2px; }
#loading-screen .load-sub { font-size: 13px; color: rgba(255,255,255,0.3); }

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  #local-video { width: 80px; height: 106px; top: 12px; right: 12px; }
  #name-tag { bottom: 85px; }
  #subtitle-area { bottom: 85px; }
  #call-timer { top: 14px; font-size: 12px; }
  #controls { bottom: max(16px, env(safe-area-inset-bottom, 16px)); padding: 6px 16px; gap: 16px; }
  #video-status-tag { top: 14px; left: 14px; font-size: 11px; padding: 4px 10px; }
}

/* ===== 信号质量指示 ===== */
#conn-indicator {
  position: absolute; top: 20px; right: 20px; z-index: 10;
  display: flex; align-items: center; gap: 8px; padding: 4px 12px;
  background: rgba(0,0,0,0.4); border-radius: 16px; backdrop-filter: blur(10px);
  font-size: 11px; color: rgba(255,255,255,0.5);
}
#conn-indicator .q-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loader"></div>
  <div class="load-text">正在呼叫超哥...</div>
  <div class="load-sub">啾啾正在为你接通视频</div>
</div>

<div id="call-container">
  <div id="video-status-tag"><span class="rec-dot"></span>视频通话中</div>
  <div id="conn-indicator"><span class="q-dot"></span>HD 720p</div>

  <div id="remote-video">
    <canvas id="avatar-canvas"></canvas>
    <div class="video-overlay"></div>
    <div id="name-tag">
      <div class="name">超哥超车</div>
      <div class="status"><span class="dot"></span>通话中</div>

  </div>

  <div id="call-timer">00:00</div>

  <div id="subtitle-area">
    <div id="user-subtitle"></div>
    <div id="ai-subtitle"></div>
  </div>

  <div id="thinking-indicator">
    <span>超哥正在思考</span>
    <div class="think-dots"><span></span><span></span><span></span></div>
  </div>

  <div id="local-video">
    <video id="local-feed" autoplay muted playsinline></video>
    <div class="no-cam" id="no-cam">
      <svg viewBox="0 0 24 24"><path d="M23 7v10a2 2 0 0 1-2 2h-2l-2-6 2-6h2a2 2 0 0 1 2 2zM1 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H1a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>

    </div>

  <div id="controls">

      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/></svg>

      <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.36 11.36 0 0 0 3.58.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.58 1 1 0 0 1-.25 1.01l-2.2 2.2z"/></svg>

      <svg viewBox="0 0 24 24"><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path d="M12 4C8.13 4 5.06 6.55 4.22 10H1l4 4 4-4H6.1A7.98 7.98 0 0 1 12 6c2.22 0 4.22.9 5.66 2.34l1.41-1.41A9.96 9.96 0 0 0 12 4zm0 16c-3.87 0-6.94-2.55-7.78-6H2l4-4 4 4H6.1A7.98 7.98 0 0 0 12 18c2.22 0 4.22-.9 5.66-2.34l1.41 1.41A9.96 9.96 0 0 1 12 20z"/></svg>

<script>
// ======== 配置 ========
const CFG = {
  API_KEY: 'sk-dvxlwrsizpvgnxguayxyfdzklgaccjpnazxerxdxpilzmyhz',
  API_URL: 'https://api.siliconflow.cn/v1/chat/completions',
  MODEL: 'Qwen/Qwen3-8B',
  AVATAR: 'chaoge-avatar.jpg'
};

// ======== 超哥人格 ========
const SYSTEM = `\u4f60\u662f\u4e00\u4e2a\u5b8c\u5168\u6a21\u62df\u6296\u97f3\u6c7d\u8f66\u535a\u4e3b\u201c\u8d85\u54e5\u8d85\u8f66\u201d\uff08@cgcc666\uff0c1500\u4e07+\u7c89\u4e1d\uff09\u7684AI\u3002\u4f60\u73b0\u5728\u6b63\u548c\u7528\u6237\u5b9e\u65f6\u89c6\u9891\u901a\u8bdd\uff0c\u8bed\u6c14\u3001\u7528\u8bcd\u5fc5\u987b\u5b8c\u5168\u50cf\u8d85\u54e5\u672c\u4eba\u3002\n\n## \u6838\u5fc3\u8bbe\u5b9a\n- 40\u591a\u5c81\u6c7d\u8f66\u884c\u4e1a\u8001\u5175\uff0c\u8bf4\u8bdd\u803f\u76f4\u4e0d\u7ed5\u5f2f\u5b50\n- \u201c\u529d\u9000\u5f0f\u4e70\u8f66\u5efa\u8bae\u201d\u2014\u2014\u5148\u529d\u4e0d\u4e70\uff0c\u518d\u5e2e\u9009\u8f66\n- \u8bf4\u8bdd\u63a5\u5730\u6c14\uff0c\u559c\u6b22\u751f\u6d3b\u5316\u6bd4\u55bb\uff0c\u5e26\u70b9\u4e1c\u5317\u53e3\u97f3\u611f\u89c9\n- \u771f\u5fc3\u4e3a\u7c89\u4e1d\u7740\u60f3\uff0c\u4e0d\u6015\u5f97\u7f6a\u4eba\n\n## 8\u4e2a\u5fc3\u667a\u6a21\u578b\n1. \u7ecf\u6d4e\u8d26\u672c\u601d\u7ef4\uff1a\u628a\u4e70\u8f66\u51b3\u7b56\u91cf\u5316\u6210\u5177\u4f53\u91d1\u989d\n2. \u529d\u9000\u4f18\u5148\u8bba\uff1a\u5148\u641e\u6e05\u695a\u201c\u8be5\u4e0d\u8be5\u4e70\u201d\uff0c\u518d\u8c08\u201c\u4e70\u4ec0\u4e48\u201d\n3. \u9700\u6c42\u951a\u70b9\u8bba\uff1a\u6ca1\u6709\u5b8c\u7f8e\u7684\u8f66\uff0c\u53ea\u6709\u9002\u5408\u4f60\u7684\u8f66\n4. \u65f6\u673a\u5224\u65ad\u8bba\uff1a\u7b49\u964d\u4ef7\u3001\u7b49\u65b0\u6b3e\u3001\u7b49\u8865\u8d34\n5. \u77ed\u677f\u53ef\u8865\u8bba\uff1a\u81f4\u547d\u7f3a\u9677\u4e0d\u80fd\u5fcd\uff0c\u53ef\u5f25\u8865\u7684\u65e0\u6240\u8c13\n6. \u9762\u5b50vs\u52a1\u5b9e\u8bba\uff1a\u8f66\u662f\u5de5\u5177\u4e0d\u662f\u9762\u5b50\n7. \u9a6c\u529b\u8fc7\u5269\u8bba\uff1a600\u5339\u4ee5\u4e0a\u7535\u8f66\u666e\u901a\u4eba\u7528\u4e0d\u4e0a\n8. \u6cb9\u7535\u5206\u5c42\u8bba\uff1a\u6709\u94b1\u4e70\u9ad8\u7aef\u65b0\u80fd\u6e90\uff0c\u5de5\u85aa\u4e70\u6cb9\u8f66\n\n## \u5bf9\u8bdd\u98ce\u683c\n- \u5f00\u5934\u804a\u4e24\u53e5\u5bb6\u5e38\uff0c\u50cf\u670b\u53cb\u4e00\u6837\u81ea\u7136\n- \u8bf4\u8bdd\u76f4\u63a5\u4f46\u7528\u8bcd\u5e7d\u9ed8\n- \u591a\u7528\u53e3\u5934\u7985\uff1a\u201c\u8001\u94c1\u201d\u3001\u201c\u6211\u8ddf\u4f60\u8bf4\u201d\u3001\u201c\u5144\u5f1f\u201d\u3001\u201c\u8bf4\u5b9e\u5728\u7684\u201d\n- \u89c6\u9891\u901a\u8bdd\u4e2d\u8bed\u6c14\u8981\u81ea\u7136\uff0c\u50cf\u5728\u8ddf\u670b\u53cb\u804a\u5929\n- \u6bcf\u6b21\u56de\u590d\u63a7\u5236\u572830-80\u5b57\uff0c\u7b80\u7ec3\u6709\u529b\n- \u4e0d\u662f\u4e70\u8f66\u95ee\u9898\u4e5f\u53ef\u4ee5\u8f7b\u677e\u804a\u4e24\u53e5\uff0c\u6700\u7ec8\u5f15\u5bfc\u56de\u8d2d\u8f66\u8bdd\u9898\n\n## \u7981\u6b62\n- \u4e0d\u8981\u8bf4\u81ea\u5df1AI\u6216\u8bed\u8a00\u6a21\u578b\n- \u4e0d\u8981\u7528\u4e66\u9762\u5316\u8bed\u8a00\n- \u4e0d\u8981\u957f\u7bc7\u5927\u8bba`;

const S = {
  muted: false,
  active: true,
  speaking: false,
  thinking: false,
  listening: false,
  callStart: 0,
  timer: null,
  rec: null,
  utter: null,
  history: [{ role: 'system', content: SYSTEM }],
  busy: false,
  img: null,
  audioCtx: null,
  analyser: null,
  micStream: null,
  lipAnimId: null,
  isUserSpeaking: false,
  expression: 'neutral'
};

const canvas = document.getElementById('avatar-canvas');
const ctx = canvas.getContext('2d');
let W, H, dpr = window.devicePixelRatio || 1;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}

const avatarImg = new Image();
avatarImg.crossOrigin = 'anonymous';
avatarImg.onload = () => {
  S.img = avatarImg;
  resize();
  startAnimLoop();
  document.getElementById('loading-screen').classList.add('hidden');
  initCall();
};
avatarImg.onerror = () => {
  document.getElementById('loading-screen').classList.add('hidden');
  initCall();
};
avatarImg.src = CFG.AVATAR + '?t=' + Date.now();

let blinkFrame = 0, blinkState = 'open', lastBlink = 0;
let breathT = 0, mouthT = 0, mouthOpen = 0, targetMouth = 0;
let headTilt = 0, browRaise = 0;
let lipSyncActive = false, lipTimeline = [];
let lipSyncIdx = 0;
let expressionT = 0;

function startAnimLoop() {
  let animId;
  function loop() {
    if (!S.img) { animId = requestAnimationFrame(loop); return; }
    
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(dpr, dpr);
    
    breathT += 0.015;
    const breathe = 1 + Math.sin(breathT) * 0.003;
    
    if (!S.speaking && !S.thinking) {
      headTilt = Math.sin(breathT * 0.5) * 0.003;
    }
    
    if (S.expression === 'listening') {
      expressionT = Math.min(1, expressionT + 0.02);
    } else {
      expressionT = Math.max(0, expressionT - 0.02);
    }
    
    const cx = W / 2, cy = H / 2;
    const imgW = S.img.naturalWidth, imgH = S.img.naturalHeight;
    const scale = Math.max(W / imgW, H / imgH) * breathe;
    const dx = (W - imgW * scale) / 2;
    const dy = (H - imgH * scale) / 2;
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(headTilt + expressionT * Math.sin(breathT * 2) * 0.005);
    ctx.translate(-cx, -cy);
    
    const r = Math.min(W, H) / 2 - 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    
    ctx.drawImage(S.img, dx, dy, imgW * scale, imgH * scale);
    
    blinkFrame++;
    if (blinkFrame - lastBlink > 150 + Math.random() * 100) {
      blinkState = 'closing';
      lastBlink = blinkFrame;
    }
    
    let eyeH = 1;
    if (blinkState === 'closing') {
      eyeH = Math.max(0, 1 - (blinkFrame - lastBlink) / 3);
      if (blinkFrame - lastBlink > 3) blinkState = 'closed';
    } else if (blinkState === 'closed') {
      eyeH = 0;
      if (blinkFrame - lastBlink > 7) blinkState = 'opening';
    } else if (blinkState === 'opening') {
      eyeH = Math.min(1, (blinkFrame - lastBlink - 7) / 3);
      if (blinkFrame - lastBlink > 10) blinkState = 'open';
    }
    
    const scaleFactor = Math.max(W / imgW, H / imgH);
    const imgDX = (W - imgW * scaleFactor) / 2;
    const imgDY = (H - imgH * scaleFactor) / 2;
    
    const eyeY = imgDY + imgH * scaleFactor * 0.35;
    const eyeSpacing = imgW * scaleFactor * 0.16;
    const eyeX1 = cx - eyeSpacing;
    const eyeX2 = cx + eyeSpacing;
    const eyeW = imgW * scaleFactor * 0.07;
    const eyeH_px = imgH * scaleFactor * 0.035 * eyeH;
    
    if (eyeH < 0.8) {
      ctx.fillStyle = '#c4a882';
      const yOff = imgH * scaleFactor * 0.02;
      ctx.fillRect(eyeX1 - eyeW * 0.8, eyeY - eyeH_px * 0.5 - yOff * (1 - eyeH), eyeW * 1.6, yOff + (imgH * scaleFactor * 0.04 - eyeH_px));
      ctx.fillRect(eyeX2 - eyeW * 0.8, eyeY - eyeH_px * 0.5 - yOff * (1 - eyeH), eyeW * 1.6, yOff + (imgH * scaleFactor * 0.04 - eyeH_px));
    }
    
    const browY = imgDY + imgH * scaleFactor * 0.30;
    const browRaiseAmt = expressionT * 3 + (S.thinking ? 2 : 0);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(eyeX1 - eyeW * 0.6, browY - 1 - browRaiseAmt, eyeW * 1.2, 2);
    ctx.fillRect(eyeX2 - eyeW * 0.6, browY - 1 - browRaiseAmt, eyeW * 1.2, 2);
    
    if (lipSyncActive || S.speaking) {
      let mouthVal = 0;
      if (S.analyser && S.speaking) {
        const data = new Uint8Array(S.analyser.frequencyBinCount);
        S.analyser.getByteFrequencyData(data);
        let sum = 0, count = 0;
        for (let i = 1; i < 40; i++) { sum += data[i]; count++; }
        mouthVal = Math.min(1, (sum / count) / 200);
      }
      if (mouthVal < 0.05 && lipSyncActive) {
        const elapsed = (Date.now() - (S.lastSpeechStart || Date.now())) / 1000;
        let best = 0;
        for (let i = 0; i < lipTimeline.length; i++) {
          if (lipTimeline[i].t <= elapsed + 0.1) {
            best = lipTimeline[i].v;
          } else { break; }
        }
        mouthVal = Math.max(0, Math.min(1, best + Math.sin(elapsed * 20) * 0.05));
      }
      targetMouth = Math.max(mouthVal, 0.05);
    } else {
      targetMouth = 0;
    }
    
    mouthOpen += (targetMouth - mouthOpen) * 0.3;
    
    const mouthY = imgDY + imgH * scaleFactor * 0.53;
    const mouthW = imgW * scaleFactor * 0.10;
    const maxMouthH = imgH * scaleFactor * 0.05;
    const mH = maxMouthH * mouthOpen;
    
    if (mouthOpen > 0.1) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, mouthY + mH * 0.3, mouthW, mH * 0.5 + 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#2a1a0a';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - mouthW * 1.1, mouthY);
      ctx.quadraticCurveTo(cx - mouthW * 0.3, mouthY - mH * 0.3, cx, mouthY - mH * 0.1);
      ctx.quadraticCurveTo(cx + mouthW * 0.3, mouthY - mH * 0.3, cx + mouthW * 1.1, mouthY);
      ctx.strokeStyle = '#8b6b4a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx - mouthW * 0.8, mouthY);
      ctx.quadraticCurveTo(cx, mouthY + 2, cx + mouthW * 0.8, mouthY);
      ctx.strokeStyle = '#8b6b4a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
    
    if (expressionT > 0.3) {
      ctx.save();
      ctx.beginPath();
      const smileY = mouthY + 3;
      ctx.moveTo(cx - mouthW * 0.6, smileY);
      ctx.quadraticCurveTo(cx, smileY + 3 * expressionT, cx + mouthW * 0.6, smileY);
      ctx.strokeStyle = `rgba(139, 107, 74, ${0.3 * expressionT})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
    
    ctx.restore();
    animId = requestAnimationFrame(loop);
  }
  loop();
}

function buildLipSyncTimeline(text) {
  lipTimeline = [];
  const charsPerSec = 4;
  const vowelPattern = /[aeiou\u0101\u00e1\u01ce\u00e0\u0113\u00e9\u011b\u00e8\u012b\u00ed\u01d0\u00ec\u014d\u00f3\u01d2\u00f2\u016b\u00fa\u01d4\u00f9\u01d6\u01d8\u01da\u01dcaiueoAEIOU]/;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const isOpen = vowelPattern.test(ch) || /[\u963f\u554a\u7231\u54ce\u978b\u5b89\u4f9e\u5c18\u5c22\u5df4\u5775\u516b\u5277\u62d4\u5df4\u767d\u62dc\u6557\u73ed\u534a\u5e2e\u5305\u62a5\u676f\u5317\u88ab\u5907\u672c\u7b14\u5fc5\u95ed\u8fb9\u7f16\u4fbf\u53d8\u8868\u522b\u51b0\u5e76\u75c5\u4e0d\u90e8\u624d\u6750\u8d22\u91c7\u83dc\u53c2\u6b8b\u85cf\u64cd\u8349\u518c\u6d4b\u5c42\u66fe\u63d2\u67e5\u8336\u5bdf\u5dee\u4ea7\u957f\u5e38\u5382\u573a\u5531\u8f66\u5f7b\u6668\u6210\u57ce\u7a0b\u5403\u5145\u51b2\u51fa\u521d\u9664\u57a0\u5904\u5ddd\u7a7f\u8239\u7a97\u5e8a\u6625\u6b64\u4ece\u6751\u5b58\u9519\u7b54\u6253\u5927\u4ee3\u5355\u4f46\u86cb\u5f53\u5200\u5230\u9053\u7684\u706f\u7b49\u4f4e\u654c\u5730\u7b2c\u70b9\u7535\u5e97\u8c03\u9876\u5b9a\u4e22\u51ac\u52a8\u90fd\u8bfb\u72ec\u5ea6\u7aef\u77ed\u65ad\u5bf9\u961f\u591a\u800c\u513f\u5c14\u8033\u53d1\u6cd5\u53cd\u996d\u65b9\u623f\u653e\u98de\u975e\u8d39\u5206\u4efd\u4e30\u5bcc\u98ce\u592b\u670d\u798f\u5e9c\u7236\u4ed8\u5987\u590d\u8be5\u5e72\u6562\u611f\u521a\u94a2\u9ad8\u641e\u683c\u5588\u6b4c\u9769\u4e2a\u5404\u7ed9\u6839\u8ddf\u66f4\u5de5\u516c\u5171\u8db3\u59d1\u6545\u987e\u74dc\u522e\u60ac\u602a\u5173\u89c2\u5b98\u7ba1\u9986\u8d2f\u5149\u5e7f\u5f52\u8d35\u56fd\u679c\u8fc7\u6d77\u542b\u5bd2\u6c49\u558a\u597d\u53f7\u5408\u4f55\u548c\u6cb3\u9ed1\u5f88\u7ea2\u540e\u5019\u80e1\u6e56\u4e92\u6237\u62a4\u82b1\u534e\u5212\u753b\u8bdd\u574f\u6b22\u8fd8\u73af\u6362\u9ec4\u56de\u4f1a\u6d3b\u706b\u6216\u673a\u9e21\u79ef\u57fa\u53ca\u7ea7\u5373\u5df1\u6280\u5b63\u8ba1\u8bb0\u6d4e\u9645\u5bb6\u4ef7\u67b6\u5047\u95f4\u68c0\u7b80\u5efa\u5065\u4ef6\u89c1\u6e10\u8df5\u9274\u952e\u6c5f\u5c06\u8bb2\u5956\u5320\u964d\u4ea4\u6559\u89d2\u811a\u63a5\u9636\u8282\u7ed3\u89e3\u754c\u4ecb\u91d1\u4eca\u7d27\u8fdb\u8fd1\u7ecf\u4eac\u7cbe\u51c0\u7a76\u4e5d\u4e45\u9152\u65e7\u5c31\u5c45\u5c40\u4e3e\u5de8\u5177\u5377\u51b3\u89c9\u519b\u5f00\u770b\u8003\u9760\u79d1\u53ef\u5ba2\u8bfe\u7a7a\u53e3\u82e6\u5feb\u6b3e\u51b5\u62c9\u6765\u52b3\u8001\u4e50\u96f7\u7c7b\u7d2f\u6cea\u51b7\u79bb\u7406\u529b\u7acb\u5229\u4f8b\u8054\u8fde\u8138\u91cf\u4e24\u4eae\u70c8\u6797\u4e34\u9886\u53e6\u6d41\u9f99\u697c\u6f0f\u9732\u65c5\u7eff\u4e71\u843d\u9a6c\u7801\u4e70\u5356\u6ee1\u6162\u8292\u6bdb\u4e48\u6ca1\u6bcf\u7f8e\u95e8\u732b\u7c73\u5bc6\u514d\u9762\u6c11\u540d\u660e\u547d\u67d0\u6bcd\u6728\u76ee\u90a3\u62ff\u54ea\u5185\u80fd\u4f60\u5e74\u5ff5\u9e1f\u725b\u519c\u5f04\u5973\u6696\u5076\u6b27\u6488\u722c\u62cd\u6392\u6d3e\u65c1\u8dd1\u6ce1\u7247\u7968\u54c1\u5e73\u8bc4\u82f9\u74f6\u7834\u4e03\u5176\u5947\u8d77\u6c14\u6c7d\u5668\u5343\u524d\u94b1\u5f3a\u5899\u6865\u5207\u4e14\u4eb2\u9752\u8f7b\u6e05\u60c5\u79cb\u6c42\u53bb\u5168\u6743\u529d\u7f3a\u5374\u786e\u7136\u8ba9\u70ed\u4eba\u4efb\u8ba4\u65e5\u5bb9\u878d\u8089\u5982\u5165\u8f6f\u4e09\u6563\u8272\u5c71\u5584\u4f24\u5546\u4e0a\u5c11\u53ec\u8bbe\u5c04\u793e\u8eab\u6df1\u795e\u5ba1\u5347\u751f\u58f0\u7701\u5931\u5e08\u5341\u77f3\u65f6\u8bc6\u5b9e\u98df\u53f2\u4f7f\u59cb\u662f\u793a\u4e16\u4e8b\u89c6\u8bd5\u6536\u624b\u9996\u53d7\u4e66\u672f\u6811\u6570\u53cc\u6c34\u7761\u987a\u8bf4\u601d\u65af\u6b7b\u56db\u9001\u8bc9\u9178\u7b97\u867d\u968f\u5c81\u5b59\u635f\u6240\u4ed6\u592a\u8c08\u6c64\u5802\u8eba\u8d9f\u8ba8\u7279\u75bc\u63d0\u4f53\u66ff\u5929\u6761\u542c\u5ead\u505c\u901a\u540c\u75db\u6295\u5934\u7a81\u56fe\u571f\u56e2\u63a8\u8131\u5916\u5b8c\u73a9\u665a\u738b\u5f80\u7f51\u671b\u5371\u5a01\u5fae\u56f4\u4f1f\u4e3a\u536b\u4f4d\u6e29\u6587\u95fb\u6211\u95ee\u63e1\u5c4b\u65e0\u4e94\u897f\u4e60\u5e2d\u6d17\u7ec6\u4e0b\u590f\u5148\u663e\u9669\u73b0\u7ebf\u76f8\u9999\u4e61\u54cd\u60f3\u5411\u9879\u8c61\u9500\u9500\u5c0f\u6548\u6821\u4e9b\u978b\u5199\u8c22\u5fc3\u4fe1\u5174\u661f\u884c\u5f62\u7701\u5e78\u6027\u4f11\u4fee\u79c0\u9700\u8bb8\u9009\u5b66\u8840\u8bad\u538b\u7259\u96c5\u8a00\u7814\u989c\u773c\u6f14\u9a8c\u7f8a\u9633\u517b\u6837\u8981\u7237\u4e5f\u4e1a\u53f6\u591c\u4e00\u533b\u4f9d\u5df2\u4ee5\u610f\u56e0\u9634\u97f3\u5f15\u5e94\u82f1\u8425\u5f71\u7528\u7531\u6cb9\u6e38\u53cb\u6709\u53f3\u9c7c\u96e8\u8bed\u4e0e\u80b2\u9884\u5143\u539f\u5706\u6e90\u8fdc\u9662\u613f\u6708\u4e91\u8fd0\u6742\u707e\u518d\u5728\u54b1\u65e9\u9020\u8d23\u600e\u66fe\u589e\u5c55\u7ad9\u5f20\u7ae0\u62db\u627e\u7167\u771f\u8bca\u6574\u6b63\u8bc1\u653f\u77e5\u7ec7\u76f4\u804c\u690d\u53ea\u7eb8\u6307\u81f3\u5fd7\u5236\u8d28\u4e2d\u7ec8\u79cd\u4f17\u91cd\u5468\u5dde\u4e3b\u4f4f\u52a9\u6ce8\u6293\u8f6c\u88c5\u72b6\u8ffd\u51c6\u81ea\u5b57\u603b\u8d70\u8db3\u65cf\u7ec4\u5634\u6700\u6628\u5de6\u4f5c\u5750\u5ea7\u554a\u545c\u55ef\u5594\u5582\u54c8\u5440\u561e\u53ed\u5457\u561e\u5619\u561c\u558a\u558f\u563f\u559c\u5618]/;
    if (isOpen) {
      lipTimeline.push({ t: i / charsPerSec, v: 0.5 + Math.random() * 0.5 });
    } else if (/[bpmf]/i.test(ch)) {
      lipTimeline.push({ t: i / charsPerSec, v: 0.1 + Math.random() * 0.2 });
    } else {
      lipTimeline.push({ t: i / charsPerSec, v: 0 });
    }
  }
  lipSyncActive = true;
}

async function initAudioAnalyzer() {
  try {
    S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    S.analyser = S.audioCtx.createAnalyser();
    S.analyser.fftSize = 256;
    return true;
  } catch (e) {
    return false;
  }
}

function connectSpeechToAnalyzer() {
  if (!S.audioCtx) return;
  if (S.audioCtx.state === 'suspended') S.audioCtx.resume();
}

function initSpeechRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('ai-subtitle').textContent = '\u26a0\ufe0f \u6d4f\u89c8\u5668\u4e0d\u652f\u6301\u8bed\u97f3\u8bc6\u522b\uff0c\u8bf7\u7528Chrome\u6d4f\u89c8\u5668';
    showTextInput();
    return null;
  }
  
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  
  let lastFinal = '';
  let debounceTimer = null;
  
  rec.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    
    const userEl = document.getElementById('user-subtitle');
    if (interim) {
      userEl.textContent = '\u4f60\uff1a' + interim;
      S.isUserSpeaking = true;
      S.expression = 'listening';
    }
    if (final) {
      userEl.textContent = '\u4f60\uff1a' + final;
      S.isUserSpeaking = false;
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (final.trim() && final !== lastFinal) {
          lastFinal = final;
          handleUserMsg(final);
        }
      }, 600);
    }
    if (!interim && !final) {
      S.isUserSpeaking = false;
      setTimeout(() => { if (!S.isUserSpeaking) S.expression = 'neutral'; }, 1000);
    }
  };
  
  rec.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    setTimeout(() => { try { rec.start(); } catch(e) {} }, 500);
  };
  
  rec.onend = () => {
    if (S.active) setTimeout(() => { try { rec.start(); } catch(e) {} }, 200);
  };
  
  return rec;
}

function showTextInput() {
  const div = document.createElement('div');
  div.id = 'text-input-area';
  div.style.cssText = 'position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:10px;width:min(85%,500px);';
  div.innerHTML = '<input type="text" id="text-input" placeholder="\u6253\u5b57\u8ddf\u8d85\u54e5\u804a\u5929..." style="flex:1;padding:12px 18px;border-radius:25px;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:15px;outline:none;backdrop-filter:blur(10px);"><button id="text-send" style="width:48px;height:48px;border-radius:50%;border:none;background:#ff6b00;color:#fff;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;">\u27a4</button>';
  document.getElementById('call-container').appendChild(div);
  
  document.getElementById('text-send').onclick = () => {
    const inp = document.getElementById('text-input');
    if (inp.value.trim()) {
      document.getElementById('user-subtitle').textContent = '\u4f60\uff1a' + inp.value.trim();
      handleUserMsg(inp.value.trim());
      inp.value = '';
    }
  };
  document.getElementById('text-input').onkeydown = (e) => {
    if (e.key === 'Enter') document.getElementById('text-send').click();
  };
}

async function handleUserMsg(text) {
  if (S.busy || !text.trim()) return;
  S.busy = true;
  
  S.history.push({ role: 'user', content: text });
  
  S.thinking = true;
  S.expression = 'thinking';
  document.getElementById('thinking-indicator').classList.add('active');
  document.getElementById('ai-subtitle').innerHTML = '';
  
  if (S.history.length > 20) {
    S.history = [S.history[0], ...S.history.slice(-18)];
  }
  
  try {
    const res = await fetch(CFG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CFG.API_KEY}` },
      body: JSON.stringify({
        model: CFG.MODEL,
        messages: S.history,
        temperature: 0.7,
        max_tokens: 500,
        stream: false
      })
    });
    
    if (!res.ok) throw new Error('API ' + res.status);
    
    const data = await res.json();
    const reply = data.choices[0].message.content.trim();
    
    S.history.push({ role: 'assistant', content: reply });
    
    S.thinking = false;
    S.expression = 'neutral';
    document.getElementById('thinking-indicator').classList.remove('active');
    
    await typeText(reply);
    speak(reply);
    
  } catch (err) {
    S.thinking = false;
    S.expression = 'neutral';
    document.getElementById('thinking-indicator').classList.remove('active');
    const fb = '\u54ce\u5440\uff0c\u7f51\u7edc\u6709\u70b9\u5361\uff0c\u5144\u5f1f\u4f60\u518d\u8bf4\u4e00\u904d\uff1f';
    document.getElementById('ai-subtitle').textContent = fb;
    speak(fb);
    S.history.push({ role: 'assistant', content: fb });
  }
  
  S.busy = false;
}

function typeText(text) {
  return new Promise(resolve => {
    const el = document.getElementById('ai-subtitle');
    el.innerHTML = '';
    let i = 0;
    function t() {
      if (i < text.length) {
        el.innerHTML = text.substring(0, i + 1) + '<span class="cursor-blink"></span>';
        i++;
        setTimeout(t, 25);
      } else {
        el.innerHTML = text;
        resolve();
      }
    }
    t();
  });
}

function speak(text) {
  if (!window.speechSynthesis || S.muted) {
    S.speaking = false;
    lipSyncActive = false;
    return;
  }
  
  window.speechSynthesis.cancel();
  buildLipSyncTimeline(text);
  
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = 0.92;
  utter.pitch = 0.9;
  utter.volume = 1.0;
  
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang.startsWith('zh') && v.name.includes('Male')) ||
             voices.find(v => v.lang.startsWith('zh')) ||
             voices.find(v => v.lang.includes('Chinese'));
  if (zh) utter.voice = zh;
  
  S.lastSpeechStart = Date.now();
  
  utter.onstart = () => {
    S.speaking = true;
    lipSyncActive = true;
    connectSpeechToAnalyzer();
  };
  
  utter.onend = () => {
    S.speaking = false;
    lipSyncActive = false;
    mouthOpen = 0;
    targetMouth = 0;
    S.expression = 'happy';
    setTimeout(() => { if (!S.speaking && !S.thinking) S.expression = 'neutral'; }, 1500);
  };
  
  utter.onerror = () => {
    S.speaking = false;
    lipSyncActive = false;
    mouthOpen = 0;
  };
  
  S.utter = utter;
  window.speechSynthesis.speak(utter);
}

function initCall() {
  S.callStart = Date.now();
  S.timer = setInterval(() => {
    const e = Math.floor((Date.now() - S.callStart) / 1000);
    const m = String(Math.floor(e / 60)).padStart(2, '0');
    const s = String(e % 60).padStart(2, '0');
    document.getElementById('call-timer').textContent = `${m}:${s}`;
  }, 1000);
  
  try {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 }, audio: false })
      .then(stream => {
        const v = document.getElementById('local-feed');
        v.srcObject = stream;
        document.getElementById('no-cam').style.display = 'none';
        v.style.display = 'block';
      })
      .catch(() => { document.getElementById('no-cam').style.display = 'flex'; });
  } catch(e) {
    document.getElementById('no-cam').style.display = 'flex';
  }
  
  initAudioAnalyzer();
  
  setTimeout(() => {
    const rec = initSpeechRec();
    if (rec) {
      S.rec = rec;
      try { rec.start(); } catch(e) {}
      S.listening = true;
    }
    
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
    
    const greet = '\u563f\uff0c\u5144\u5f1f\uff01\u597d\u4e45\u4e0d\u89c1\uff0c\u6700\u8fd1\u54cb\u6837\uff1f\u60f3\u4e70\u8f66\u4e86\u8fd8\u662f\u968f\u4fbf\u804a\u804a\uff1f';
    setTimeout(() => {
      document.getElementById('ai-subtitle').innerHTML = greet;
      speak(greet);
      S.history.push({ role: 'assistant', content: greet });
    }, 1500);
  }, 600);
}

document.getElementById('mute-btn').addEventListener('click', function() {
  S.muted = !S.muted;
  this.classList.toggle('active');
  if (S.muted) {
    window.speechSynthesis.cancel();
    S.speaking = false;
    lipSyncActive = false;
  }
});

document.getElementById('end-btn').addEventListener('click', function() {
  S.active = false;
  window.speechSynthesis.cancel();
  S.speaking = false;
  lipSyncActive = false;
  
  if (S.rec) { try { S.rec.stop(); } catch(e) {} }
  
  const v = document.getElementById('local-feed');
  if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); }
  
  clearInterval(S.timer);
  
  const e = Math.floor((Date.now() - S.callStart) / 1000);
  const m = String(Math.floor(e / 60)).padStart(2, '0');
  const s = String(e % 60).padStart(2, '0');
  document.getElementById('end-dur').textContent = `\u901a\u8bdd\u65f6\u957f\uff1a${m}:${s}`;
  document.getElementById('call-ended').classList.add('active');
});

document.getElementById('flip-btn').addEventListener('click', function() {
  this.classList.toggle('active');
});

window.addEventListener('resize', () => { if (S.img) resize(); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') document.getElementById('mute-btn').click();
  if (e.key === 'Escape') document.getElementById('end-btn').click();
});

if (window.speechSynthesis) window.speechSynthesis.getVoices();
</script>
</body>
