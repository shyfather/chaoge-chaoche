<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <title>超哥超车 · 数字人语音助手</title>
  <style>
/* ============================================================
   VoxEMW 风格暗色主题 · 数字人前端样式
   ============================================================ */

/* --- 全局变量 --- */
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #4c9aff;
  --live: #3fb950;
  --warn: #d29922;
  --danger: #f85149;
  --orange: #ff6b00;
  --font: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --radius: 12px;
  --radius-lg: 20px;
  --transition: 0.2s ease;
}

/* --- 基础重置 --- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Stage 容器 --- */
.stage {
  width: min(1080px, 100vw);
  margin: 0 auto;
  padding: 16px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
}

/* --- Topbar --- */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  padding: 4px 0;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar-left h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
}

.topbar-left h1 .accent {
  color: var(--orange);
}

.status {
  font-size: 13px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--warn) 20%, transparent);
  color: var(--warn);
  transition: background var(--transition), color var(--transition);
}

.status.live {
  background: color-mix(in srgb, var(--live) 20%, transparent);
  color: var(--live);
}

.status.warn {
  background: color-mix(in srgb, var(--warn) 20%, transparent);
  color: var(--warn);
}

.status.danger {
  background: color-mix(in srgb, var(--danger) 20%, transparent);
  color: var(--danger);
}

.topbar-right {
  display: flex;
  align-items: center;
}

.api-indicator {
  font-size: 12px;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 99px;
}

/* --- Call View (双列布局) --- */
.call-view {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  flex: 1;
  min-height: 0;
}

/* --- 摄像头包裹 --- */
.cam-wrap,
.avatar-wrap {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

.cam-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  display: block;
}

.cam-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 14px;
  background: var(--panel);
}

/* --- 数字人包裹 --- */
.avatar-wrap canvas {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.avatar-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 14px;
  background: var(--panel);
}

/* --- Pane 标签 --- */
.pane-label {
  position: absolute;
  top: 8px;
  left: 8px;
  background: color-mix(in srgb, #000 60%, transparent);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 99px;
  z-index: 2;
  line-height: 1.6;
  user-select: none;
  pointer-events: none;
  backdrop-filter: blur(4px);
}

/* --- 数字人状态标签 --- */
.avatar-state {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 99px;
  z-index: 2;
  line-height: 1.6;
  user-select: none;
  pointer-events: none;
  transition: background var(--transition), color var(--transition);
}

.avatar-state.idle {
  background: color-mix(in srgb, var(--muted) 25%, transparent);
  color: var(--muted);
}

.avatar-state.listening {
  background: color-mix(in srgb, var(--accent) 25%, transparent);
  color: var(--accent);
}

.avatar-state.thinking {
  background: color-mix(in srgb, var(--warn) 25%, transparent);
  color: var(--warn);
}

.avatar-state.speaking {
  background: color-mix(in srgb, var(--live) 25%, transparent);
  color: var(--live);
}

/* --- Persona 切换栏 --- */
.persona-bar {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-shrink: 0;
  overflow-x: auto;
  padding: 4px 0;
  -webkit-overflow-scrolling: touch;
}

.persona-chip {
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 18px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
  user-select: none;
  flex-shrink: 0;
}

.persona-chip:hover {
  border-color: var(--accent);
  color: var(--text);
}

.persona-chip.active {
  background: var(--orange);
  border-color: var(--orange);
  color: #fff;
}

/* --- 转录区 --- */
.transcript {
  flex-shrink: 0;
  height: 120px;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* --- 消息行 --- */
.line {
  font-size: 13px;
  line-height: 1.5;
  word-break: break-word;
  animation: fadeIn 0.3s ease;
}

.line .who {
  font-weight: 600;
  margin-right: 6px;
}

.line.user {
  color: var(--accent);
}

.line.assistant {
  color: var(--orange);
}

.line.sys {
  color: var(--muted);
  font-style: italic;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* --- 控制栏 --- */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  padding: 4px 0;
}

.controls button {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  padding: 10px 28px;
  border-radius: 99px;
  border: none;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition), opacity var(--transition);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.controls button:active {
  transform: scale(0.96);
}

.controls button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

/* --- 摄像头切换按钮 --- */
.cam-toggle {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border) !important;
}

.cam-toggle:hover:not(:disabled) {
  background: var(--border);
}

/* --- 麦克风按钮 --- */
.mic-btn {
  background: var(--accent);
  color: #fff;
  min-width: 160px;
}

.mic-btn:hover:not(:disabled) {
  background: #3a8aff;
}

.mic-btn.live {
  background: var(--danger);
  animation: pulse 1.5s ease-in-out infinite;
}

.mic-btn.live:hover:not(:disabled) {
  background: #e0403a;
}

@keyframes pulse {
  0%,
  100% {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 40%, transparent);
  }
  50% {
    box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 0%, transparent);
  }
}

/* --- 底部提示 --- */
.hint {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
  padding: 2px 0;
}

/* --- 隐藏 --- */
.hidden {
  display: none !important;
}

/* --- 自定义滚动条 --- */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}

/* --- 响应式：移动端单列 --- */
@media (max-width: 720px) {
  .stage {
    padding: 12px;
    gap: 10px;
  }

  .call-view {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .topbar-left h1 {
    font-size: 18px;
  }

  .transcript {
    height: 100px;
  }

  .controls button {
    font-size: 13px;
    padding: 8px 22px;
  }

  .mic-btn {
    min-width: 140px;
  }
}
  </style>
</head>
<body>
  <div id="overlay" class="overlay">
    <h2>🚗 超哥超车</h2>
    <p>数字人语音助手 · 云端对话</p>
    <button id="start-btn" class="start-btn" disabled>连接中...</button>
    <div class="shortcuts"><kbd>M</kbd> 静音 / <kbd>Esc</kbd> 挂断</div>
  </div>
  <main class="stage">
    <header class="topbar">
      <div class="topbar-left">
        <h1>超哥<span class="accent">超车</span></h1>
        <span id="status" class="status">未连接</span>
      </div>
      <div class="topbar-right">
        <span id="api-indicator" class="api-indicator">WS · 连接中</span>
      </div>
    </header>
    <section class="call-view">
      <div class="cam-wrap" id="cam-wrap">
        <video id="user-cam" autoplay muted playsinline></video>
        <div id="cam-fallback" class="cam-fallback">📷 摄像头未开启</div>
        <span class="pane-label">你</span>
      </div>
      <div class="avatar-wrap" id="avatar-wrap">
        <canvas id="avatar-canvas" width="512" height="512"></canvas>
        <div id="avatar-fallback" class="avatar-fallback hidden">数字人加载中...</div>
        <span class="pane-label" id="avatar-label">超哥</span>
        <span id="avatar-state" class="avatar-state idle">待机中</span>
      </div>
    </section>
    <nav id="persona-bar" class="persona-bar" aria-label="人设切换">
      <button class="persona-chip active">超哥</button>
    </nav>
    <section class="transcript" id="transcript" aria-live="polite">
      <div class="line sys">👋 说句话就能跟超哥唨嗕了！</div>
    </section>
    <footer class="controls">
      <button id="cam-toggle" class="cam-toggle">📷 摄像头</button>
      <button id="mic-btn" class="mic-btn" disabled>🎤 开始对话</button>
    </footer>
    <p class="hint">说话即可与超哥唨嗕，随时可以打断他</p>
  </main>
  <script>
"use strict";
const SAMPLE_RATE = 16000;

// WebSocket 地址：优先 URL 参数，默认同源
const WS_URL = (() => {
  const p = new URLSearchParams(location.search);
  const s = p.get("server");
  if (s) return s;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/ws`;
})();
const WS_FALLBACK_URL = "wss://chaoge-server.up.railway.app/ws";
let useFallbackWs = false;

// DOM 引用
const els = {
  status: document.getElementById("status"),
  canvas: document.getElementById("avatar-canvas"),
  personaBar: document.getElementById("persona-bar"),
  transcript: document.getElementById("transcript"),
  micBtn: document.getElementById("mic-btn"),
  camToggle: document.getElementById("cam-toggle"),
  camWrap: document.getElementById("cam-wrap"),
  camVideo: document.getElementById("user-cam"),
  camFallback: document.getElementById("cam-fallback"),
  avatarWrap: document.querySelector(".avatar-wrap"),
  avatarState: document.getElementById("avatar-state"),
  avatarLabel: document.getElementById("avatar-label"),
  apiIndicator: document.getElementById("api-indicator"),
};

// 状态
let ws = null;
let mic = null;
let player = null;
let personas = [];
let currentPersona = null;
let assistantLine = null;
let isSpeaking = false;
let isThinking = false;
let camOn = false;
let camStream = null;

// === Canvas 数字人动画 ===
const W = 512, H = 512;
const ctx = els.canvas.getContext("2d", { alpha: false, desynchronized: true });
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

const avatarImg = new Image();
let avatarLoaded = false;
let blinkState = 0, blinkTimer = 0;
let mouthOpen = 0, mouthTarget = 0;
let expression = "neutral";
let audioEnergy = 0, audioEnergySmooth = 0;
let animFrame = null;

avatarImg.src = "chaoge-avatar.jpg";
avatarImg.onload = () => { avatarLoaded = true; startAnimLoop(); };
avatarImg.onerror = () => { avatarLoaded = false; startAnimLoop(); };

function startAnimLoop() {
  if (animFrame) return;
  const loop = () => { animFrame = requestAnimationFrame(loop); drawFrame(); updateAnimState(); };
  animFrame = requestAnimationFrame(loop);
}

function updateAnimState() {
  blinkTimer++;
  if (blinkState === 0 && blinkTimer > 180 + Math.random() * 180) { blinkState = 1; blinkTimer = 0; }
  else if (blinkState === 1 && blinkTimer > 3) { blinkState = 2; blinkTimer = 0; }
  else if (blinkState === 2 && blinkTimer > 2) { blinkState = 0; blinkTimer = 0; }
  audioEnergySmooth += (audioEnergy - audioEnergySmooth) * 0.15;
  mouthTarget = isSpeaking ? Math.min(1, audioEnergySmooth * 2.5 + 0.2) : 0;
  mouthOpen += (mouthTarget - mouthOpen) * 0.2;
  if (isThinking) expression = "thinking";
  else if (isSpeaking) expression = "happy";
  else expression = "neutral";
}

function drawFrame() {
  ctx.fillStyle = "#0d1117"; ctx.fillRect(0, 0, W, H);
  if (avatarLoaded && avatarImg.complete && avatarImg.naturalWidth > 0) {
    const size = Math.min(W, H) * 0.9, cx = W / 2, cy = H / 2 - 10, s = size / 2;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI * 2); ctx.clip();
    const scale = Math.max(size / avatarImg.naturalWidth, size / avatarImg.naturalHeight);
    const dx = cx - (avatarImg.naturalWidth * scale) / 2, dy = cy - (avatarImg.naturalHeight * scale) / 2;
    ctx.drawImage(avatarImg, dx, dy, avatarImg.naturalWidth * scale, avatarImg.naturalHeight * scale);
    ctx.restore();
    const imgScale = Math.max(size / avatarImg.naturalWidth, size / avatarImg.naturalHeight);
    const imgW = avatarImg.naturalWidth * imgScale, imgH = avatarImg.naturalHeight * imgScale;
    const imgX = cx - imgW / 2, imgY = cy - imgH / 2;
    const eyeY = imgY + imgH * 0.38, eyeSpacing = imgW * 0.22, mouthY = imgY + imgH * 0.68;
    if (blinkState !== 0) {
      const eyeH = blinkState === 1 ? imgH * 0.06 : imgH * 0.03;
      ctx.fillStyle = "#0d1117";
      ctx.fillRect(cx - eyeSpacing - imgW * 0.07, eyeY - eyeH / 2, imgW * 0.14, eyeH);
      ctx.fillRect(cx + eyeSpacing - imgW * 0.07, eyeY - eyeH / 2, imgW * 0.14, eyeH);
    }
    if (mouthOpen > 0.05) {
      const mw = imgW * 0.12 + mouthOpen * imgW * 0.08, mh = mouthOpen * imgH * 0.08;
      ctx.fillStyle = "#1a0a0a";
      ctx.beginPath(); ctx.ellipse(cx, mouthY + mh * 0.3, mw / 2, mh / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f0f0f0";
      ctx.beginPath(); ctx.ellipse(cx, mouthY - mh * 0.15, mw * 0.35, mh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (expression === "thinking") {
      ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - eyeSpacing - imgW * 0.04, eyeY - imgH * 0.06);
      ctx.lineTo(cx - eyeSpacing + imgW * 0.04, eyeY - imgH * 0.03);
      ctx.moveTo(cx + eyeSpacing - imgW * 0.04, eyeY - imgH * 0.03);
      ctx.lineTo(cx + eyeSpacing + imgW * 0.04, eyeY - imgH * 0.06);
      ctx.stroke();
    }
  } else {
    drawFallbackAvatar();
  }
}

function drawFallbackAvatar() {
  const cx = W / 2, cy = H / 2 - 10;
  ctx.fillStyle = "#d4a574"; ctx.beginPath(); ctx.arc(cx, cy, 200, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2a2a2a";
  ctx.beginPath(); ctx.ellipse(cx, cy - 110, 170, 80, 0, Math.PI, 0); ctx.fill();
  const eyeY = cy - 30, eyeSpacing = 55;
  if (blinkState === 0) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(cx - eyeSpacing, eyeY, 25, 22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + eyeSpacing, eyeY, 25, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3a2a1a"; ctx.beginPath(); ctx.arc(cx - eyeSpacing, eyeY, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + eyeSpacing, eyeY, 12, 0, Math.PI * 2); ctx.fill();
  } else {
    const eyeH = blinkState === 1 ? 12 : 6;
    ctx.fillStyle = "#0d1117";
    ctx.fillRect(cx - eyeSpacing - 25, eyeY - eyeH / 2, 50, eyeH);
    ctx.fillRect(cx + eyeSpacing - 25, eyeY - eyeH / 2, 50, eyeH);
  }
  if (mouthOpen > 0.05) {
    const mw = 30 + mouthOpen * 20, mh = mouthOpen * 20;
    ctx.fillStyle = "#1a0a0a";
    ctx.beginPath(); ctx.ellipse(cx, cy + 60 + mh * 0.3, mw / 2, mh / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f0f0f0";
    ctx.beginPath(); ctx.ellipse(cx, cy + 60 - mh * 0.15, mw * 0.35, mh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// === PCM 编解码 ===
function floatTo16BitPCM(float32) {
  const int16 = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return int16;
}

function base64FromInt16(int16) {
  const bytes = new Uint8Array(int16.buffer);
  let binary = "";
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function int16FromBase64(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}

// === 音频播放 ===
function ensurePlayer() {
  if (!player) {
    player = { ctx: new AudioContext({ sampleRate: SAMPLE_RATE }), nextStartTime: 0 };
  }
  if (player.ctx.state === "suspended") player.ctx.resume();
  return player;
}

function playPCM(int16) {
  const p = ensurePlayer();
  const buf = p.ctx.createBuffer(1, int16.length, SAMPLE_RATE);
  const data = buf.getChannelData(0);
  for (let i = 0; i < int16.length; i++) data[i] = int16[i] / 0x8000;
  const src = p.ctx.createBufferSource();
  src.buffer = buf;
  src.connect(p.ctx.destination);
  const start = Math.max(p.ctx.currentTime + 0.02, p.nextStartTime);
  src.start(start);
  p.nextStartTime = start + buf.duration;
}

function flushPlayback() {
  if (player) {
    player.ctx.close();
    player = null;
  }
}

// === 麦克风 (AudioWorklet) ===
const WORKLET_SRC = `
class PCMCapture extends AudioWorkletProcessor {
  process(inputs) {
    const input = inputs[0];
    if (input && input[0] && input[0].length > 0) {
      this.port.postMessage(input[0].slice(0));
    }
    return true;
  }
}
registerProcessor("pcm-capture", PCMCapture);
`;

async function startMic() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  });
  const ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  await ctx.audioWorklet.addModule(
    URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }))
  );
  const source = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, "pcm-capture");
  node.port.onmessage = (e) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      const int16 = floatTo16BitPCM(e.data);
      ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: base64FromInt16(int16) }));
    }
  };
  source.connect(node);
  const gain = ctx.createGain();
  gain.gain.value = 0;
  node.connect(gain);
  gain.connect(ctx.destination);
  mic = { ctx, stream, node };
}

function stopMic() {
  if (!mic) return;
  mic.node.disconnect();
  mic.stream.getTracks().forEach((t) => t.stop());
  mic.ctx.close();
  mic = null;
}

// === 转录区 ===
function addLine(cls, who, text) {
  const div = document.createElement("div");
  div.className = `line ${cls}`;
  if (who) {
    const span = document.createElement("span");
    span.className = "who";
    span.textContent = who;
    div.appendChild(span);
  }
  div.appendChild(document.createTextNode(text));
  els.transcript.appendChild(div);
  els.transcript.scrollTop = els.transcript.scrollHeight;
  return div;
}

function appendAssistantDelta(delta) {
  if (!assistantLine) {
    const name = (personas.find((p) => p.id === currentPersona) || {}).name || "助手";
    assistantLine = addLine("assistant", `${name}:`, "");
  }
  assistantLine.appendChild(document.createTextNode(delta));
  els.transcript.scrollTop = els.transcript.scrollHeight;
}

// === 状态 ===
function setStatus(text, cls) {
  els.status.textContent = text;
  els.status.className = `status ${cls || ""}`;
}

function setAvatarState(state) {
  const labels = { idle: "待机中", listening: "聆听中", thinking: "思考中", speaking: "说话中" };
  els.avatarState.textContent = labels[state] || state;
  els.avatarState.className = `avatar-state ${state}`;
}

// === 人设 ===
function updatePersonaBar() {
  els.personaBar.innerHTML = "";
  for (const p of personas) {
    const chip = document.createElement("button");
    chip.className = "persona-chip" + (p.id === currentPersona ? " active" : "");
    chip.textContent = p.name;
    chip.onclick = () => switchPersona(p.id);
    els.personaBar.appendChild(chip);
  }
}

function switchPersona(id) {
  if (!ws || ws.readyState !== WebSocket.OPEN || id === currentPersona) return;
  ws.send(JSON.stringify({ type: "vox.persona", persona: id }));
  currentPersona = id;
  assistantLine = null;
  updatePersonaBar();
}

// === WebSocket 消息处理 ===
function handleEvent(event) {
  switch (event.type) {
    case "vox.status":
      setStatus(event.status, event.status === "connected" || event.status === "idle" ? "live" : event.status === "error" ? "danger" : "warn");
      if (event.status === "connected") {
        currentPersona = event.persona;
        updatePersonaBar();
      }
      if (event.status === "connected" || event.status === "idle") setAvatarState("idle");
      else if (event.status === "listening" || event.status === "transcribing") setAvatarState("listening");
      else if (event.status === "thinking") { setAvatarState("thinking"); isThinking = true; }
      else if (event.status === "speaking") { setAvatarState("speaking"); isSpeaking = true; isThinking = false; }
      else if (event.status === "error") setAvatarState("idle");
      break;

    case "vox.persona":
      currentPersona = event.persona.id;
      updatePersonaBar();
      break;

    case "input_audio_buffer.speech_started":
      flushPlayback();
      assistantLine = null;
      isSpeaking = false;
      setAvatarState("listening");
      break;

    case "response.output_audio_transcript.delta":
      if (event.delta) appendAssistantDelta(event.delta);
      break;

    case "response.output_audio.delta":
      if (event.delta) {
        playPCM(int16FromBase64(event.delta));
        const samples = int16FromBase64(event.delta);
        let sum = 0;
        for (let i = 0; i < samples.length; i++) sum += Math.abs(samples[i]);
        audioEnergy = sum / samples.length / 32768;
      }
      break;

    case "response.done":
      assistantLine = null;
      isSpeaking = false;
      isThinking = false;
      audioEnergy = 0;
      if (!event.interrupted) setAvatarState("idle");
      break;

    case "conversation.item.input_audio_transcription.completed": {
      const text = (event.transcript || "").trim();
      if (text) addLine("user", "你:", text);
      break;
    }
    case "response.cancel":
      flushPlayback();
      assistantLine = null;
      isSpeaking = false;
      isThinking = false;
      audioEnergy = 0;
      setAvatarState("idle");
      break;
  }
}

// === WebSocket 连接（含 fallback） ===
function connectWS() {
  if (ws) try { ws.close(); } catch (_) {}
  const url = useFallbackWs ? WS_FALLBACK_URL : WS_URL;
  try { ws = new WebSocket(url); } catch (_) {
    setStatus("连接失败", "danger");
    if (els.apiIndicator) els.apiIndicator.textContent = "WS · 失败";
    if (!useFallbackWs) {
      useFallbackWs = true;
      setTimeout(connectWS, 1000);
    } else {
      setTimeout(connectWS, 3000);
    }
    return;
  }
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    setStatus("已连接", "live");
    if (els.apiIndicator) els.apiIndicator.textContent = "WS · 已连接";
    els.micBtn.disabled = false;
    setAvatarState("idle");
    addLine("sys", "", "已连接到云端服务器，点击开始对话");
    // 隐藏启动覆层
    const overlay = document.getElementById("overlay");
    if (overlay) overlay.classList.add("hidden");
  };
  ws.onclose = () => {
    setStatus("已断开", "warn");
    els.micBtn.disabled = true;
    setAvatarState("idle");
    if (els.apiIndicator) els.apiIndicator.textContent = "WS · 断开";
    if (!useFallbackWs) {
      useFallbackWs = true;
      setTimeout(connectWS, 1000);
    } else {
      setTimeout(connectWS, 3000);
    }
  };
  ws.onerror = () => {
    setStatus("连接错误", "warn");
    if (els.apiIndicator) els.apiIndicator.textContent = "WS · 错误";
    if (!useFallbackWs) {
      useFallbackWs = true;
      setTimeout(connectWS, 1000);
    } else {
      setTimeout(connectWS, 3000);
    }
  };
  ws.onmessage = (msg) => {
    if (typeof msg.data === "string") handleEvent(JSON.parse(msg.data));
  };
}

// === 初始化（含 personas fallback） ===
async function init() {
  try {
    const res = await fetch("api/personas");
    const data = await res.json();
    personas = data.list || [];
    currentPersona = data.default || "chaoge";
    updatePersonaBar();
  } catch (e) {
    // 同源失败，尝试远程
    try {
      const res = await fetch("https://chaoge-server.up.railway.app/api/personas");
      const data = await res.json();
      personas = data.list || [];
      currentPersona = data.default || "chaoge";
      updatePersonaBar();
    } catch (e2) {
      personas = [{ id: "chaoge", name: "超哥超车", description: "汽车博主" }];
      currentPersona = "chaoge";
      updatePersonaBar();
    }
  }
  connectWS();
}

// === 摄像头切换 ===
async function toggleCam() {
  if (camOn) {
    camStream.getTracks().forEach((t) => t.stop());
    camStream = null;
    camOn = false;
    els.camToggle.textContent = "📷 摄像头";
    els.camToggle.classList.remove("on");
    els.camWrap.classList.remove("live");
    els.camVideo.srcObject = null;
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
    });
    camStream = stream;
    camOn = true;
    els.camVideo.srcObject = stream;
    els.camToggle.textContent = "📷 关闭摄像头";
    els.camToggle.classList.add("on");
    els.camWrap.classList.add("live");
  } catch (e) {
    addLine("sys", "", `⚠ 摄像头不可用: ${e.message}`);
  }
}

els.camToggle.onclick = toggleCam;

// === 键盘快捷键 ===
document.addEventListener("keydown", (e) => {
  if (e.key === "m" || e.key === "M") {
    els.micBtn.click();
  } else if (e.key === "c" || e.key === "C") {
    els.camToggle.click();
  } else if (e.key === "Escape" && mic) {
    stopMic();
    els.micBtn.textContent = "🎤 开始对话";
    els.micBtn.classList.remove("live");
    setStatus("已连接", "live");
    setAvatarState("idle");
  }
});

// === 麦克风按钮 ===
els.micBtn.onclick = async () => {
  if (mic) {
    stopMic();
    els.micBtn.textContent = "🎤 开始对话";
    els.micBtn.classList.remove("live");
    setStatus("已连接", "live");
    setAvatarState("idle");
    return;
  }
  try {
    await startMic();
    els.micBtn.textContent = "■ 结束对话";
    els.micBtn.classList.add("live");
    setStatus("聆听中", "live");
    setAvatarState("listening");
  } catch (e) {
    addLine("sys", "", `⚠ 麦克风不可用: ${e.message}`);
  }
};

// 启动覆盖层按钮
document.addEventListener("DOMContentLoaded", () => {
  const startBtn = document.getElementById("start-btn");
  if (startBtn) {
    // 连接成功后自动隐藏
    startBtn.textContent = "连接中...";
    startBtn.disabled = true;
  }
});

init();
  </script>
